name: Publicar APK Comandero
on:
  push:
    branches: [main]
    paths: ['apk/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Poner la APK más reciente en la versión publicada (compartida con Enlace Móvil)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls apk/ComanderoMovil-*.apk | sort -V | tail -1)
          VER=$(basename "$APK" .apk | sed 's/ComanderoMovil-//')
          TAG=$(gh release list --exclude-drafts --exclude-pre-releases --json tagName,isLatest --jq '.[]|select(.isLatest)|.tagName')
          echo "APK $VER -> release $TAG"
          # quita APKs anteriores para que la app encuentre solo la nueva
          for a in $(gh release view "$TAG" --json assets --jq '.assets[].name' | grep -E '^ComanderoMovil-.*\.apk$' || true); do
            [ "$a" = "$(basename "$APK")" ] || gh release delete-asset "$TAG" "$a" -y
          done
          cp "$APK" Comandero-SoftGala.apk
          gh release upload "$TAG" "$APK" Comandero-SoftGala.apk --clobber
          NOTAS="apk/notas-$VER.md"
          if [ -f "$NOTAS" ]; then
            gh release view "$TAG" --json body --jq .body > cuerpo.md
            if ! grep -q "APK Comandero $VER" cuerpo.md; then
              { cat "$NOTAS"; echo; echo '---'; echo; cat cuerpo.md; } > nuevo.md
              gh release edit "$TAG" --notes-file nuevo.md
            fi
          fi
