name: Restaurar v0.9.19
on:
  push:
    branches: [main]
    paths: ['restaurar/**']
permissions:
  contents: write
jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset v0.9.19 ComanderoMovil-0.6.0.apk -y || true
          cp restaurar/ComanderoMovil-0.5.0.apk Comandero-SoftGala.apk
          gh release upload v0.9.19 restaurar/ComanderoMovil-0.5.0.apk Comandero-SoftGala.apk --clobber
          gh release edit v0.9.19 --notes-file restaurar/notas.md
